<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine-Planet Login</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">CINE-PLANET</div>
      <nav>
        <a href="/">Início</a>
        <a href="/filmes.html">Em Cartaz</a>
        <a href="/sobre.html">Sobre</a>
      </nav>
    </header>

    <main class="login-wrap">
      <section class="login-card">
        <h1>Login</h1>
        <p>Acesse sua conta para ver sessões, notificações e reservas.</p>

        <form>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Email" required />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Sua senha"
              required
            />
          </div>

          <div class="form-actions">
            <button type="button">Entrar</button>
          </div>

          <div class="login-links">
            <a href="/cadastro.html">Criar conta</a>
          </div>
        </form>
        <p class="login-demo-note">Tela demonstrativa: o acesso ainda não está ativo.</p>
      </section>
    </main>
    <footer class="footer">
      <p>© 2026 Cine-Planet · Poá, São Paulo</p>
    </footer>
  </body>
</html>
