<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine-Planet</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">CINE-PLANET</div>
      <nav>
        <a href="/filmes.html">Filmes</a>
        <a href="/sobre.html">Sobre</a>
        <a href="/login.html" class="login-btn">Login</a>
      </nav>
    </header>

    <main>
      <section class="destaque-filme">
        <img
          class="destaque-filme-imagem"
          src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1600&q=80"
          alt="Cinema"
        />
        <div class="destaque-filme-sobreposicao"></div>

        <div class="destaque-filme-conteudo">
          <h1>Cine<br /><span>Planet </span></h1>
          <p>
            Depois de salvar o Reino dos Cogumelos, Mario e seus amigos se encontram em uma
            missão intergaláctica para deter um novo vilão ameaçador.
          </p>
          <div class="destaque-filme-acoes">
            <a href="/filmes.html" class="primary-btn">Ver Filmes</a>
          </div>
        </div>
      </section>

      <section class="section" id="em-cartaz">
        <div class="section-header">
          <span>Agora nos telões</span>
          <h2>Em Cartaz</h2>
        </div>
        <p id="filmes-status" class="filmes-status" role="status">Carregando filmes...</p>
        <div class="grid" id="filmes-grid" data-filmes="destaques"></div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 Cine-Planet · Poá, São Paulo</p>
    </footer>
    <script src="/js/lista-filmes.js"></script>
  </body>
</html>
