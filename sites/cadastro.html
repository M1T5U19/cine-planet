<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine-Planet Cadastro</title>
    <link rel="stylesheet" href="..\style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">CINE-PLANET</div>
      <nav>
        <a href="..\index.html">Início</a>
        <a href="filmes.html">Em Cartaz</a>
        <a href="sobre.html">Sobre</a>
      </nav>
    </header>

    <main>
      <section class="auth-container">
        <div class="auth-box">
          <h1>Criar Conta</h1>
          <p class="auth-subtitle">Cadastre-se para acessar o Lumière</p>

          <form>
            <input type="text" placeholder="Nome completo" required />
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Senha" required />
            <input type="password" placeholder="Confirmar senha" required />

            <button type="submit">Cadastrar</button>
          </form>

          <p class="auth-footer">
            Já tem conta?
            <a href="login.html">Entrar</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 Lumière Cinema</p>
    </footer>
  </body>
</html>
