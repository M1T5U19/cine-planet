<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine-Planet Login</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">CINE-PLANET</div>
      <nav>
        <a href="/">Início</a>
        <a href="/filmes.html">Em Cartaz</a>
        <a href="/sobre.html">Sobre</a>
      </nav>
    </header>

    <main class="login-wrap">
      <section class="login-card">
        <h1>Área pros administradores</h1>
        <p>Entre com seu usuário administrador para gerenciar os filmes.</p>
        <form method="post" action="/login">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Seu nome"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Sua senha"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="form-actions">
            <button type="submit">Entrar</button>
          </div>
        </form>
        <p id="login-erro" class="login-error" role="alert" hidden>
          Nome ou senha incorretos.
        </p>

      </section>
    </main>
    <footer class="footer">
      <p>© 2026 Cine-Planet · Poá, São Paulo</p>
    </footer>
    <script src="/js/login.js" defer></script>
  </body>
</html>
